name: Build Android APK

# 只在 offline-4500 分支跑，不影响 main 分支的 Pages 部署。
on:
  push:
    branches: [offline-4500]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 真人语音：4500 词约 100MB，CI 时下载进 public/data/audio/（不进 git），
      # 构建时一并打进 APK。缓存避免每次全量重下（key 含词表 + 脚本哈希，任一变更则失效重下）。
      - name: Cache pronunciation audio
        uses: actions/cache@v4
        with:
          path: public/data/audio
          key: audio-v1-${{ hashFiles('public/data/cet4.json', 'scripts/download-audio.py') }}
          restore-keys: audio-v1-
      - name: Download pronunciation audio (Wiktionary, ~100MB)
        run: python3 scripts/download-audio.py
      - name: Audio stats
        run: |
          COUNT=$(ls public/data/audio/*.ogg public/data/audio/*.mp3 public/data/audio/*.wav 2>/dev/null | wc -l)
          echo "audio files: $COUNT"
          du -sh public/data/audio
          python3 -c "import json; r=json.load(open('public/data/audio/report.json')); print('with_audio:', r['with_audio'], 'no_audio:', len(r['no_audio']), 'failed:', len(r['failed']))"
          test "$COUNT" -gt 0 || (echo "ERROR: no audio files downloaded" && exit 1)
      - run: npm run build
      # 热更新（OTA）产物：对比 dist 与 scripts/ota-baseline.json，生成 ota-publish/
      # （新版清单 + 变更文件），作为 CI artifact 供人工检查后手动 rsync 到服务器。
      # continue-on-error：绝不阻断 APK 构建；CI 不自动部署到服务器（见 UPDATES.md）。
      - name: Build OTA publish bundle
        continue-on-error: true
        run: python3 scripts/build-ota.py || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ota-publish
          path: ota-publish/
          if-no-files-found: ignore
      - run: npx cap sync android
      - name: Download Whisper model into APK assets
        run: |
          MODEL_SRC="https://huggingface.co/Xenova/whisper-tiny.en/resolve/main"
          DEST="android/app/src/main/assets/public/models/Xenova/whisper-tiny.en/resolve/main"
          mkdir -p "$DEST/onnx"
          for f in config.json generation_config.json preprocessor_config.json \
            tokenizer.json tokenizer_config.json vocab.json merges.txt \
            special_tokens_map.json added_tokens.json normalizer.json quant_config.json \
            onnx/encoder_model_quantized.onnx onnx/decoder_model_merged_quantized.onnx; do
            echo "download: $f"
            curl -fL --retry 2 -o "$DEST/$f" "$MODEL_SRC/$f"
          done
          du -sh "$DEST"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 7 要求 Java 21（Java 17 会报 invalid source release: 21）
          java-version: 21
      # 不用 android-actions/setup-android：它会在新版 cmdline-tools 上跑 `sdkmanager tools`
      # （该包已不存在）而失败。ubuntu-latest 自带 Android SDK（ANDROID_HOME 已设好），Gradle 直接用它。
      - name: Check preinstalled Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/build-tools" | tail -n 3
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: APK size
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          echo "== verify audio bundled in APK (fails if missing) =="
          AUDIO_COUNT=$(unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -c "assets/public/data/audio/" || true)
          echo "audio entries in APK: $AUDIO_COUNT"
          test "$AUDIO_COUNT" -gt 0 || (echo "ERROR: no audio in APK" && exit 1)
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep "assets/public/data/audio/manifest.json" || (echo "ERROR: manifest missing in APK" && exit 1)
          MODEL_COUNT=$(unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -c "assets/public/models/" || true)
          echo "model entries in APK: $MODEL_COUNT"
      - uses: actions/upload-artifact@v4
        with:
          name: pronunciation-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
