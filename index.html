<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="输入单词，听读音，跟读打分。" />
    <title>发音</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="hero">
        <h1>🎙️ 发音</h1>
        <button id="settingsBtn" class="settings-btn" aria-label="设置">⚙️</button>
      </header>

      <section class="card settings-card" id="settingsCard" hidden>
        <div class="settings-row">
          <span class="settings-label">音标</span>
          <div class="seg">
            <button id="ipaUkBtn" class="btn seg-btn">英式</button>
            <button id="ipaUsBtn" class="btn seg-btn">美式</button>
          </div>
        </div>
        <div class="settings-row">
          <button id="settingsLogBtn" class="btn small">📋 日志</button>
        </div>
        <p id="settingsStatus" class="status" aria-live="polite"></p>
      </section>

      <section class="card search-card">
        <div class="search-row">
          <input id="wordInput" type="text" placeholder="输入单词，如 thought" autocomplete="off" spellcheck="false" />
          <button id="lookupBtn" class="btn primary">查</button>
        </div>
        <p id="lookupStatus" class="status" aria-live="polite"></p>
      </section>

      <section class="card" id="wordCard" hidden>
        <div class="word-head">
          <h2 id="wordTitle">—</h2>
          <span id="posBadge" class="badge"></span>
        </div>
        <p class="ipa" id="ipaText">—</p>
        <button id="defToggleBtn" class="def-toggle" hidden>释义 ▾</button>
        <p class="def" id="defText" hidden></p>

        <div class="play-row">
          <button id="playNormal" class="btn play icon-btn" aria-label="播放">🔊</button>
        </div>
        <audio id="refAudio" preload="auto" playsinline></audio>
      </section>

      <section class="card" id="practiceCard" hidden>
        <div class="rec-row">
          <button id="recBtn" class="btn danger hold-btn icon-btn" aria-label="按住录音">🎙️</button>
          <button id="playMineBtn" class="btn" hidden>▶ 回放</button>
        </div>
        <audio id="myAudio" controls hidden></audio>
        <p id="recStatus" class="status" aria-live="polite"></p>
        <p id="modelStatus" class="status muted"></p>

        <div id="result" class="result" hidden>
          <div class="score-row">
            <div class="score-circle"><span id="scoreNum">—</span><small>/ 100</small></div>
            <div>
              <p class="grade" id="gradeText"></p>
              <p>识别为：<strong id="recognizedText">—</strong></p>
            </div>
          </div>

          <div class="phon-row">
            <div><span class="lbl">标准</span><div id="expectedPhonemes" class="phonemes"></div></div>
            <div><span class="lbl">你的</span><div id="userPhonemes" class="phonemes"></div></div>
          </div>
          <ul id="errorList" class="errors"></ul>
          <p id="fallbackNote" class="status muted" hidden></p>
        </div>
      </section>

    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
