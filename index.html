<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="输入单词，听读音，跟读打分。" />
    <title>发音</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='34' y='8' width='32' height='54' rx='16' fill='%232563eb'/><path d='M18 46a32 32 0 0 0 64 0M50 80v12' fill='none' stroke='%232563eb' stroke-width='8' stroke-linecap='round'/></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="wrap has-bottombar">
      <header class="hero topbar">
        <label class="topbar-search">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="wordInput" type="search" enterkeyhint="search" placeholder="输入单词，如 thought" autocomplete="off" spellcheck="false" />
          <button id="lookupBtn" class="visually-hidden">查</button>
        </label>
        <button id="settingsBtn" class="settings-btn icon-square" aria-label="设置"></button>
      </header>
      <p id="lookupStatus" class="status" aria-live="polite"></p>

      <section class="card settings-card settings-float" id="settingsCard" hidden>
        <div class="settings-row">
          <span class="settings-label">音标</span>
          <div class="seg">
            <button id="ipaUkBtn" class="btn seg-btn">英式</button>
            <button id="ipaUsBtn" class="btn seg-btn">美式</button>
          </div>
        </div>
        <div class="settings-row">
          <button id="settingsLogBtn" class="btn small">日志</button>
        </div>
        <div class="settings-row">
          <button id="settingsUpdateBtn" class="btn small">检查更新</button>
          <span id="settingsVersion" class="settings-version"></span>
        </div>
        <p id="settingsStatus" class="status" aria-live="polite"></p>
      </section>

      <section class="card" id="wordCard" hidden>
        <div class="word-head">
          <h2 id="wordTitle">—</h2>
          <span id="posBadge" class="badge"></span>
        </div>
        <div class="ipa-row">
          <div class="ipa-left"><span id="ipaAccent" class="ipa-accent">英</span><p class="ipa" id="ipaText">—</p></div>
          <button id="playNormal" class="speaker-btn" aria-label="播放"></button>
        </div>
        <button id="defToggleBtn" class="def-toggle pill" hidden>释义</button>
        <p class="def" id="defText" hidden></p>
        <audio id="refAudio" preload="auto" playsinline></audio>
      </section>

      <section class="card" id="practiceCard" hidden>
        <p id="recStatus" class="status" aria-live="polite"></p>
        <p id="modelStatus" class="status muted"></p>

        <div id="result" class="result" hidden>
          <div class="score-row">
            <div class="score-circle"><span id="scoreNum">—</span><small>/ 100</small></div>
            <div>
              <p class="grade" id="gradeText"></p>
              <p class="recog">识别为：<strong id="recognizedText">—</strong></p>
            </div>
          </div>

          <div class="phon-col">
            <span class="lbl">标准</span><div id="expectedPhonemes" class="phonemes"></div>
            <span class="lbl">你的</span><div id="userPhonemes" class="phonemes"></div>
          </div>
          <ul id="errorList" class="errors"></ul>
          <p id="fallbackNote" class="status muted" hidden></p>
        </div>
      </section>

    </main>
    <div class="bottombar" id="bottomBar">
      <button id="playMineBtn" class="replay-btn" hidden>回放</button>
      <button id="recBtn" class="rec-btn hold-btn" aria-label="按住录音">按住录音</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // 热更新引导：必须放在入口 module 脚本之后（module 脚本延迟执行，
      // 经典内联脚本先跑，才能在它执行前替换它）。Vite 构建时原样保留此脚本。
      // 若 App 私有目录已有热更新版入口 JS/CSS/HTML（经 OTA 下载），用热更新版替换内置版；
      // 否则保持内置版。任何异常都静默回落内置版，绝不白屏。
      // __EptBundledVersion__ 由 vite.config.ts 在构建时替换为 APK 内置清单版本。
      (function () {
        try {
          var cap = window.Capacitor;
          if (!cap || !cap.convertFileSrc) return; // 非 Capacitor（网页版）：直接用内置版
          var files = JSON.parse(localStorage.getItem('ept_ota_files') || '{}');
          var applied = localStorage.getItem('ept_ota_version') || '';
          var bundled = '__EptBundledVersion__';
          if (!applied || !bundled || bundled === '0.0.0') return;
          // 只有热更新版 >= 内置版时才启用；新 APK 内置版更新时忽略旧热更新
          if (compareVersions(applied, bundled) < 0) return;
          // 入口 HTML：若有 OTA 版 index.html 且当前是内置页（非 OTA 文件），重定向到 OTA 版。
          // OTA 版页内也会跑这段引导，但当前 URL 已是 OTA 文件（_capacitor_file_），不再重定向，避免循环。
          var isOtaPage = window.location.href.indexOf('_capacitor_file_') !== -1;
          if (!isOtaPage) {
            for (var k in files) {
              if (files[k] && files[k].uri && files[k].role === 'entry-html') {
                window.location.href = cap.convertFileSrc(files[k].uri);
                return;
              }
            }
          }
          var jsEntry = null;
          var cssEntry = null;
          for (var k in files) {
            if (!files[k] || !files[k].uri) continue;
            if (files[k].role === 'entry-js') jsEntry = files[k];
            if (files[k].role === 'entry-css') cssEntry = files[k];
          }
          // 入口 CSS：换 href（无加载失败回落需求，CSS 失败只影响样式）
          if (cssEntry) {
            var link = document.querySelector('link[rel="stylesheet"]');
            if (link) link.href = cap.convertFileSrc(cssEntry.uri);
          }
          // 入口 JS：移除内置脚本，注入热更新脚本；加载失败时回落内置版
          if (jsEntry) {
            var mod = document.querySelector('script[type="module"]');
            if (mod) {
              var builtInSrc = mod.getAttribute('src');
              var ota = document.createElement('script');
              ota.type = 'module';
              ota.src = cap.convertFileSrc(jsEntry.uri);
              ota.onerror = function () {
                var fb = document.createElement('script');
                fb.type = 'module';
                if (builtInSrc) fb.src = builtInSrc;
                document.head.appendChild(fb);
              };
              mod.remove();
              document.head.appendChild(ota);
            }
          }
        } catch (e) { /* 回落内置版 */ }
        function compareVersions(a, b) {
          var pa = String(a).split('.').map(function (x) { return parseInt(x, 10) || 0; });
          var pb = String(b).split('.').map(function (x) { return parseInt(x, 10) || 0; });
          var n = Math.max(pa.length, pb.length);
          for (var i = 0; i < n; i++) {
            var d = (pa[i] || 0) - (pb[i] || 0);
            if (d !== 0) return d;
          }
          return 0;
        }
      })();
    </script>
  </body>
</html>
