# pronounce.benext.uk — 英语发音纠正（自有服务器部署）
# 启用步骤（需 DNS 先解析到 198.200.49.120）：
#   1. DNS 添加 A 记录 pronounce.benext.uk -> 198.200.49.120，等待生效
#   2. certbot --nginx -d pronounce.benext.uk  (会自动写入 ssl_certificate 行；本文件预留位置，首次启用前请先去掉 ssl 相关行或先用 certbot 生成)
#   3. cp server/nginx-pronounce.benext.uk.conf /etc/nginx/conf.d/pronunciation.conf
#   4. nginx -t && nginx -s reload  (仅 reload，不 restart，不动其他服务)
# 注意：本文件是独立文件，不修改任何现有 conf.d 文件。neko / suichuan (8081) 不受影响。

server {
    listen 80;
    server_name pronounce.benext.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name pronounce.benext.uk;

    # 由 certbot --nginx -d pronounce.benext.uk 自动生成/更新：
    ssl_certificate     /etc/letsencrypt/live/pronounce.benext.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pronounce.benext.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;
    # 模型文件较大，允许长一点的超时；静态文件本身走 sendfile
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # ---- 静态页面：/pronunciation/ ----
    # 前端 Vite base './'，用相对路径，挂在 /pronunciation/ 下可直接工作。
    # 用 alias + try_files，注意 alias 末尾斜杠。
    location /pronunciation/ {
        alias /opt/pronunciation-trainer/dist/;
        index index.html;
        try_files $uri $uri/ /pronunciation/index.html;
        # HTML 不缓存，保证更新即时；JS/CSS 可缓存
        location ~* \.html$ {
            add_header Cache-Control "no-cache";
        }
    }

    # 根路径直接跳到应用，避免用户打开域名看到 404
    location = / {
        return 302 /pronunciation/;
    }

    # ---- 词典反代：/pronunciation/api/dict/ -> https://api.dictionaryapi.dev/ ----
    # 前端 isSelfHosted 时会走这里，音频 URL 也已改写为同源。
    location /pronunciation/api/dict/ {
        proxy_pass https://api.dictionaryapi.dev/;
        proxy_http_version 1.1;
        proxy_set_header Host api.dictionaryapi.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 10s;
        # 词典响应可短缓存，减轻源站压力
        proxy_cache_valid 200 10m;
    }

    # ---- 模型静态托管：/pronunciation/models/ ----
    # 目录结构：/opt/pronunciation-trainer/models/Xenova/whisper-tiny.en/resolve/main/<file>
    # 前端 whisper.ts 自有服务器时 remoteHost = origin + /pronunciation/models
    location /pronunciation/models/ {
        alias /opt/pronunciation-trainer/models/;
        # 模型文件大且不变，允许长缓存；浏览器 + transformers.js 也会缓存
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        # 允许跨域（同源即可，但留着无害）
        add_header Access-Control-Allow-Origin *;
    }
}
