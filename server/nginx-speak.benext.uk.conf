# speak.benext.uk — 英语发音纠正（专用域名，直接挂根路径 /，不再带 /pronunciation/ 后缀）
# 独立文件，不修改任何现有 vhost。neko / frh / suichuan 不受影响。
# 旧 /pronunciation/* 与 /pronounce* 统一 301 到根，避免 404。
server {
    listen 80;
    listen [::]:80;
    server_name speak.benext.uk;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name speak.benext.uk;
    ssl_certificate     /etc/letsencrypt/live/speak.benext.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/speak.benext.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # 旧路径兼容：/pronunciation /pronunciation/* /pronounce /pronounce/* -> 根路径对应地址
    location = /pronunciation {
        return 301 /;
    }
    location ~ ^/pronunciation/(.*)$ {
        return 301 /$1;
    }
    location = /pronounce {
        return 301 /;
    }
    location ~ ^/pronounce/(.*)$ {
        return 301 /$1;
    }

    # 应用本身：根路径直接 serve
    location / {
        root /opt/pronunciation-trainer/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        location ~* \.html$ {
            add_header Cache-Control "no-cache";
        }
    }

    # 词典反代：/api/dict/ -> https://api.dictionaryapi.dev/
    location /api/dict/ {
        proxy_pass https://api.dictionaryapi.dev/;
        proxy_http_version 1.1;
        proxy_set_header Host api.dictionaryapi.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_cache_valid 200 10m;
    }

    # 模型静态托管：/models/
    location /models/ {
        alias /opt/pronunciation-trainer/models/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header Access-Control-Allow-Origin *;
    }

    # Wikimedia 兜底音频：/api/commons/ -> commons.wikimedia.org，/api/wikimedia/ -> upload.wikimedia.org
    location /api/commons/ {
        proxy_pass https://commons.wikimedia.org/;
        proxy_http_version 1.1;
        proxy_set_header Host commons.wikimedia.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 10s;
    }
    location /api/wikimedia/ {
        proxy_pass https://upload.wikimedia.org/;
        proxy_http_version 1.1;
        proxy_set_header Host upload.wikimedia.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
